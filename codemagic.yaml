workflows:
  ios-workflow:
    name: Zamvu iOS Workflow
    max_build_duration: 90
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: zamvu-codemagic
    environment:
      groups:
        - code-signing
      vars:
        BUNDLE_IDENTIFIER: com.zamvu.app
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
        APP_STORE_APP_ID: 6804423619
      node: latest
      xcode: latest
      cocoapods: default
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
    scripts:
      - name: Install npm dependencies
        script: |
          npm install
      - name: Add iOS platform (ilk sefer)
        script: |
          npx cap add ios || true
      - name: Generate app icons and splash screens
        script: |
          npm install @capacitor/assets --save-dev
          npx capacitor-assets generate --iconBackgroundColor '#0f5c35' --splashBackgroundColor '#0f5c35' --iconBackgroundColorDark '#0f5c35' --splashBackgroundColorDark '#0f5c35'
      - name: Raise minimum iOS version (capgo/social-login gereksinimi)
        script: |
          cat > /tmp/set_deployment_target.rb << 'RBEOF'
          require 'xcodeproj'
          project = Xcodeproj::Project.open('ios/App/App.xcodeproj')
          target = project.targets.first
          target.build_configurations.each do |config|
            config.build_settings['IPHONEOS_DEPLOYMENT_TARGET'] = '15.0'
          end
          project.root_object.build_configuration_list.build_configurations.each do |config|
            config.build_settings['IPHONEOS_DEPLOYMENT_TARGET'] = '15.0'
          end
          project.save
          RBEOF
          ruby /tmp/set_deployment_target.rb
          if [ -f ios/App/Podfile ]; then
            sed -i '' "s/platform :ios, '[0-9.]*'/platform :ios, '15.0'/" ios/App/Podfile
          fi
      - name: Sync Capacitor with iOS project
        script: |
          npx cap sync ios
      - name: Copy GoogleService-Info.plist (Firebase push notifications)
        script: |
          cp ios-config/GoogleService-Info.plist ios/App/App/GoogleService-Info.plist
      - name: Add push notification entitlement (KESIN cozum)
        script: |
          cat > ios/App/App/App.entitlements << 'ENTEOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
          	<key>aps-environment</key>
          	<string>production</string>
          	<key>com.apple.developer.associated-domains</key>
          	<array>
          		<string>applinks:zamvu.com</string>
          	</array>
          	<key>com.apple.developer.applesignin</key>
          	<array>
          		<string>Default</string>
          	</array>
          </dict>
          </plist>
          ENTEOF
          cat > /tmp/add_entitlements.rb << 'RBEOF'
          require 'xcodeproj'
          project = Xcodeproj::Project.open('ios/App/App.xcodeproj')
          target = project.targets.first
          target.build_configurations.each do |config|
            config.build_settings['CODE_SIGN_ENTITLEMENTS'] = 'App/App.entitlements'
          end
          project.save
          RBEOF
          ruby /tmp/add_entitlements.rb
      - name: Enable background push notifications
        script: |
          PLIST=ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Delete :UIBackgroundModes" $PLIST 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes array" $PLIST
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes:0 string remote-notification" $PLIST
      - name: Install CocoaPods
        script: |
          cd ios/App && pod install
      - name: Increment build number (garanti yöntem)
        script: |
          #!/usr/bin/env bash
          set -e
          LATEST_BUILD_NUMBER=$(app-store-connect get-latest-build-number "$APP_STORE_APP_ID" || echo "0")
          NEW_BUILD_NUMBER=$((LATEST_BUILD_NUMBER + 1))
          echo "Yeni build numarası: $NEW_BUILD_NUMBER"
          find ios/App -name "project.pbxproj" -exec sed -i '' "s/CURRENT_PROJECT_VERSION = [0-9]*;/CURRENT_PROJECT_VERSION = ${NEW_BUILD_NUMBER};/g" {} \;
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${NEW_BUILD_NUMBER}" ios/App/App/Info.plist || true
      - name: Set export compliance (şifreleme sorusu bir daha çıkmasın)
        script: |
          /usr/libexec/PlistBuddy -c "Delete :ITSAppUsesNonExemptEncryption" ios/App/App/Info.plist 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" ios/App/App/Info.plist
      - name: Add camera and photo library permissions (uygulama kapanma sorunu)
        script: |
          PLIST=ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Delete :NSCameraUsageDescription" $PLIST 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSCameraUsageDescription string 'Zamvu, ilanına fotoğraf eklemek için kameranı kullanmak istiyor.'" $PLIST
          /usr/libexec/PlistBuddy -c "Delete :NSPhotoLibraryUsageDescription" $PLIST 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSPhotoLibraryUsageDescription string 'Zamvu, ilanına fotoğraf eklemek için galerine erişmek istiyor.'" $PLIST
          /usr/libexec/PlistBuddy -c "Delete :NSPhotoLibraryAddUsageDescription" $PLIST 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSPhotoLibraryAddUsageDescription string 'Zamvu, çektiğin fotoğrafları galerine kaydetmek için izin istiyor.'" $PLIST
          /usr/libexec/PlistBuddy -c "Delete :NSMicrophoneUsageDescription" $PLIST 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSMicrophoneUsageDescription string 'Zamvu, video çekimi sırasında mikrofonunu kullanmak isteyebilir.'" $PLIST
          /usr/libexec/PlistBuddy -c "Delete :NSLocationWhenInUseUsageDescription" $PLIST 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSLocationWhenInUseUsageDescription string 'Zamvu, ilanına konum eklemek için yerini kullanmak istiyor.'" $PLIST
          /usr/libexec/PlistBuddy -c "Delete :NSSpeechRecognitionUsageDescription" $PLIST 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSSpeechRecognitionUsageDescription string 'Zamvu, sesli ilan oluşturman için konuşmanı yazıya çevirmek istiyor.'" $PLIST
          /usr/libexec/PlistBuddy -c "Delete :CFBundleURLTypes" $PLIST 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes array" $PLIST
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0 dict" $PLIST
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes array" $PLIST
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes:0 string zamvu" $PLIST
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:1 dict" $PLIST
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:1:CFBundleURLSchemes array" $PLIST
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:1:CFBundleURLSchemes:0 string com.googleusercontent.apps.670703297575-s8bona5d3dsjqns38qnaglgipr9qgjgk" $PLIST
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLName string com.zamvu.app" $PLIST
      - name: Fetch signing files
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_IDENTIFIER" --type IOS_APP_STORE --create
      - name: Set up keychain
        script: |
          keychain initialize
          keychain add-certificates
      - name: Set up code signing settings on Xcode project
        script: |
          xcode-project use-profiles
      - name: Build ipa for distribution
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true

  android-workflow:
    name: Zamvu Android Workflow
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      vars:
        PACKAGE_NAME: com.zamvu.app
      node: latest
      java: 17
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
    scripts:
      - name: Install npm dependencies
        script: |
          npm install
      - name: Add Android platform (ilk sefer)
        script: |
          npx cap add android || true
      - name: Generate app icons and splash screens
        script: |
          npm install @capacitor/assets --save-dev
          npx capacitor-assets generate --android --iconBackgroundColor '#0f5c35' --splashBackgroundColor '#0f5c35' --iconBackgroundColorDark '#0f5c35' --splashBackgroundColorDark '#0f5c35'
      - name: Sync Capacitor with Android project
        script: |
          npx cap sync android
      - name: Copy google-services.json (Firebase push notifications, varsa)
        script: |
          if [ -f android-config/google-services.json ]; then
            cp android-config/google-services.json android/app/google-services.json
          else
            echo "android-config/google-services.json bulunamadı, bu adım atlanıyor (push bildirimleri Android'de henüz devrede değil)."
          fi
      - name: Force fixed debug signing config (Google Sign-In SHA-1 sabit kalsın)
        script: |
          mkdir -p ~/.android
          cp android-config/debug.keystore ~/.android/debug.keystore
          cp android-config/debug.keystore android/app/debug.keystore
          cat > /tmp/patch_build_gradle.js << 'NODEEOF'
          const fs = require('fs');
          const path = 'android/app/build.gradle';
          let content = fs.readFileSync(path, 'utf8');
          const marker = 'android {';
          const idx = content.indexOf(marker);
          if (idx === -1) {
            console.error('UYARI: "android {" bloğu bulunamadı, dosya elle kontrol edilmeli.');
            process.exit(1);
          }
          const insertion = `\n    signingConfigs {\n        debug {\n            storeFile file('debug.keystore')\n            storePassword 'android'\n            keyAlias 'androiddebugkey'\n            keyPassword 'android'\n        }\n    }\n`;
          const insertAt = idx + marker.length;
          content = content.slice(0, insertAt) + insertion + content.slice(insertAt);
          fs.writeFileSync(path, content);
          console.log('build.gradle guncellendi, sabit debug signingConfig eklendi.');
          NODEEOF
          node /tmp/patch_build_gradle.js
          cat android/app/build.gradle | grep -A6 "signingConfigs"
      - name: Build debug APK
        script: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
    artifacts:
      - android/app/build/outputs/apk/debug/*.apk
      - android/app/build/outputs/**/*.aab

  android-release-workflow:
    name: Zamvu Android Release (AAB)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      groups:
        - code-signing
      vars:
        PACKAGE_NAME: com.zamvu.app
      node: latest
      java: 17
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
    scripts:
      - name: Install npm dependencies
        script: |
          npm install
      - name: Add Android platform (ilk sefer)
        script: |
          npx cap add android || true
      - name: Generate app icons and splash screens
        script: |
          npm install @capacitor/assets --save-dev
          npx capacitor-assets generate --android --iconBackgroundColor '#0f5c35' --splashBackgroundColor '#0f5c35' --iconBackgroundColorDark '#0f5c35' --splashBackgroundColorDark '#0f5c35'
      - name: Sync Capacitor with Android project
        script: |
          npx cap sync android
      - name: Copy google-services.json (Firebase push notifications, varsa)
        script: |
          if [ -f android-config/google-services.json ]; then
            cp android-config/google-services.json android/app/google-services.json
          else
            echo "android-config/google-services.json bulunamadı, bu adım atlanıyor."
          fi
      - name: Decode release keystore and configure signing + versionCode
        script: |
          echo "$CM_KEYSTORE" | base64 --decode > android/app/release.keystore
          cat > /tmp/patch_release_signing.js << 'NODEEOF'
          const fs = require('fs');
          const path = 'android/app/build.gradle';
          let content = fs.readFileSync(path, 'utf8');

          const androidMarker = 'android {';
          const aIdx = content.indexOf(androidMarker);
          if (aIdx === -1) { console.error('UYARI: "android {" bulunamadi.'); process.exit(1); }
          const signingInsertion = `\n    signingConfigs {\n        release {\n            storeFile file('release.keystore')\n            storePassword System.getenv("CM_KEYSTORE_PASSWORD")\n            keyAlias System.getenv("CM_KEY_ALIAS")\n            keyPassword System.getenv("CM_KEY_PASSWORD")\n        }\n    }\n`;
          const aInsertAt = aIdx + androidMarker.length;
          content = content.slice(0, aInsertAt) + signingInsertion + content.slice(aInsertAt);

          const buildTypesIdx = content.indexOf('buildTypes {');
          if (buildTypesIdx === -1) {
            console.error('UYARI: buildTypes { bulunamadi, signingConfig atanamadi.');
          } else {
            const releaseMarker = 'release {';
            const rIdx = content.indexOf(releaseMarker, buildTypesIdx);
            if (rIdx !== -1) {
              const rInsertAt = rIdx + releaseMarker.length;
              content = content.slice(0, rInsertAt) + `\n            signingConfig signingConfigs.release` + content.slice(rInsertAt);
            } else {
              console.error('UYARI: buildTypes.release blogu bulunamadi, signingConfig atanamadi.');
            }
          }

          const buildNumber = process.env.CM_BUILD_NUMBER || '1';
          if (/versionCode\s+\d+/.test(content)) {
            content = content.replace(/versionCode\s+\d+/, 'versionCode ' + buildNumber);
            console.log('versionCode ' + buildNumber + ' olarak ayarlandi.');
          } else {
            console.error('UYARI: versionCode satiri bulunamadi.');
          }

          fs.writeFileSync(path, content);
          console.log('build.gradle release signingConfig ile guncellendi.');
          NODEEOF
          node /tmp/patch_release_signing.js
          cat android/app/build.gradle | grep -A6 "signingConfigs\|versionCode"
      - name: Build release AAB
        script: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease
    artifacts:
      - android/app/build/outputs/bundle/release/*.aab
